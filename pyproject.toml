[project]
name = "ftw"
version = "0.1.0"
description = "Framed Task Workers: a local-first agent framework with an NNG message spine and a mount/unmount skill workbench."
readme = "README.md"
authors = [
    { name = "Harri Pehkonen", email = "harry.pehkonen@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pynng>=0.9.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
ftw = "ftw.repl.cli:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0.12.20260906",
]
fuzz = [
    "hypothesis>=6.168.1",
]

[tool.mypy]
python_version = "3.14"
files = ["src/ftw"]

[[tool.mypy.overrides]]
module = "pynng.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/fuzz is deliberately excluded from ordinary discovery - it needs
# the separate "fuzz" dependency group (hypothesis), which a plain
# `uv sync`/`uv run pytest` never installs. Naming the path explicitly
# still works: `uv run --group fuzz pytest tests/fuzz`. See CLAUDE.md's
# Testing section for the exact commands and what to remove to drop this
# entirely.
norecursedirs = ["*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}", "tests/fuzz"]
timeout = 10
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
